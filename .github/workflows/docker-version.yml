name: Docker Version Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version to publish (for example: 2.4.1 or v2.4.1)'
        required: true
        type: string
      push_latest:
        description: 'Also tag the image as latest'
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    name: Resolve image metadata
    runs-on: ubuntu-22.04
    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}
      normalized_version: ${{ steps.vars.outputs.normalized_version }}
      version_tag: ${{ steps.vars.outputs.version_tag }}
      push_latest: ${{ steps.vars.outputs.push_latest }}
    permissions:
      contents: read
    steps:
      - name: Resolve release variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw_version="${{ inputs.version }}"
            push_latest="${{ inputs.push_latest }}"
          else
            raw_version="${GITHUB_REF_NAME}"
            push_latest="true"
          fi

          normalized_version="${raw_version#v}"
          version_tag="v${normalized_version}"
          image_name="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          {
            echo "image_name=${image_name}"
            echo "normalized_version=${normalized_version}"
            echo "version_tag=${version_tag}"
            echo "push_latest=${push_latest}"
          } >> "${GITHUB_OUTPUT}"

  build-and-push:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            artifact_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            artifact_suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update package.json version for build metadata
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(node -p "require('./package.json').version")"
          target_version="${{ needs.prepare.outputs.normalized_version }}"

          if [[ "${current_version}" == "${target_version}" ]]; then
            echo "package.json already at ${target_version}; skipping version update."
            exit 0
          fi

          npm version "${target_version}" --no-git-tag-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version_tag }}

      - name: Export digest
        run: |
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact_suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create multi-arch manifest
    needs:
      - prepare
      - build-and-push
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        working-directory: /tmp/digests
        shell: bash
        run: |
          set -euo pipefail

          image="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}"
          args=(
            -t "${image}:${{ needs.prepare.outputs.version_tag }}"
            -t "${image}:${{ needs.prepare.outputs.normalized_version }}"
          )
          refs=()

          if [[ "${{ needs.prepare.outputs.push_latest }}" == "true" ]]; then
            args+=(-t "${image}:latest")
          fi

          for digest in *; do
            refs+=("${image}@sha256:${digest}")
          done

          docker buildx imagetools create \
            "${args[@]}" \
            "${refs[@]}"

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.version_tag }}"
